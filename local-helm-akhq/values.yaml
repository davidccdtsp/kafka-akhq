# imagePullSecrets:
#  - name: my-repository-secret
image:
  repository: tchiotludo/akhq
  tag: "" # uses Chart.AppVersion by default
# Number of old deployment ReplicaSets to retain. The rest will be garbage collected.
revisionHistoryLimit: 10
# custom annotations (example: for prometheus)
annotations: {}
  #prometheus.io/scrape: 'true'
  #prometheus.io/port: '8080'
  #prometheus.io/path: '/prometheus'

podAnnotations: {}

configmapAnnotations: {}
  # vault.security.banzaicloud.io/vault-role: akhq
  # vault.security.banzaicloud.io/vault-serviceaccount: akhq

secretAnnotations: {}
  # same as configmapAnnotations

# custom labels
labels: {}
  # custom.label: 'true'

podLabels: {}

## You can put directly your configuration here... or add java opts or any other env vars
extraEnv: 
  - name: JAVA_OPTS
    value: "-Djavax.net.ssl.trustStore=/etc/akhq-ssl/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit"  
    # value: -Djavax.net.ssl.trustStore=/etc/akhq-ssl/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit -Dlogger.levels.io.micronaut.security=TRACE -Dlogger.levels.io.micronaut.security.authentication=TRACE -Dlogger.levels.io.micronaut.security.token=TRACE -Dlogger.levels.org.akhq=DEBUG

## Or you can also use configmap for the configuration...
configuration: 
  akhq:
    connections:
      hm-kafka:
        properties:
          bootstrap.servers: my-cluster-kafka-bootstrap:9092

    security:
      default-group: no-roles
      roles:
        topic-admin:
          - resources: [ "TOPIC", "TOPIC_DATA"]
            actions: [ "READ", "CREATE", "DELETE" ]
          - resources: ["CONSUMER_GROUP", "CONNECT_CLUSTER"]
            actions: ["READ"]  
          - resources: [ "TOPIC" ]
            actions: [ "UPDATE", "READ_CONFIG", "ALTER_CONFIG" ]
      groups:
        topic-admin-pub: 
          - role: topic-admin
            patterns: [".*"] 
        # akhq-full-admin:
        #   - role: admin
      oidc:    
        enabled: true
        providers:
          oidc:
            label: "Login with Keycloak"
            username-field: preferred_username
            # groups-field: roles
            # default-group: no-roles
            use-oidc-claim: false  
            groups:
              - name: admins
                groups:
                  # - akhq-full-admin
                  - topic-admin-pub

  micronaut:
    security:
      enabled: true
      oauth2:
        clients:
          oidc:
            client-id: "akhq-client"
            client-secret: "en5IPOldfrp6DwpTjsGTZekQncjpyUhv"
            openid:
              issuer: "https://keycloak.192.168.49.2.nip.io/realms/akhq"
              # configuration-path: "http://keycloak.kafka.svc.cluster.local:8080/realms/akhq/.well-known/openid-configuration"
              # jwks-uri: "http://keycloak.kafka.svc.cluster.local:8080/realms/akhq/protocol/openid-connect/certs"
    caches:
      local-security-claim-provider:
        enabled: false
        # expire-after-write: 600s 


